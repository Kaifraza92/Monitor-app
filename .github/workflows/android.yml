name: Failsafe Android APK Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v5

      - name: Deploy Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Install Missing Gradle Wrapper
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle wrapper
          chmod +x gradlew

      - name: Detect and Fix AI Studio Layout
        run: |
          mkdir -p gradle
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Compile Direct Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Find and Extract Generated APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-ai-studio-app
          path: "**/build/outputs/apk/debug/*.apk"
          
