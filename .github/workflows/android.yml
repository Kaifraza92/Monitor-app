name: Intelligent Android APK Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v5

      - name: Deploy Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Project, Inject Settings & Compile APK
        run: |
          # Find where build.gradle or build.gradle.kts is hiding
          PROJECT_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          echo "Found Android project folder at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Check if gradlew exists, if not create it with compatible version
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, installing Gradle..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper --gradle-version=8.7
          fi
          
          chmod +x gradlew
          
          # Create gradle configuration files
          mkdir -p gradle
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          
          # Compile with updated gradle wrapper
          ./gradlew assembleDebug --no-daemon

      - name: Find and Upload Finished APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: working-ai-studio-app
          path: "**/build/outputs/apk/debug/*.apk"
